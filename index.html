<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="○×習慣"><title>○×習慣カレンダー</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#f6f8fc;color:#1d2a3a;font-size:15px}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:1000px;margin:auto;padding:16px 10px 44px}h1{font-size:23px;margin:0}h2{font-size:16px;margin:0}p{line-height:1.6}.muted{color:#718096;font-size:12px}.top,.toolbar,.nav,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.top{margin:4px 4px 17px}.panel{background:white;border:1px solid #e5eaf2;border-radius:16px;padding:13px;margin-bottom:12px;box-shadow:0 2px 10px #15243b09}button{font:inherit;border:0;background:#eef2f8;color:#293c54;font-weight:600;border-radius:10px;padding:10px 12px;cursor:pointer;touch-action:manipulation}button.primary{background:#326be6;color:white}button.danger{background:#fff0f0;color:#c94350}button:focus-visible,input:focus-visible{outline:2px solid #326be6}.month{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.stat{background:#f7f9fd;border-radius:12px;text-align:center;padding:10px 3px}.stat strong{display:block;font-size:22px}.stat small{font-size:11px;color:#718096}.scroller{overflow-x:auto;max-width:100%;border:1px solid #e6ecf4;border-radius:11px;overscroll-behavior-x:contain;scrollbar-width:thin;margin-top:10px}.calendar{border-collapse:separate;border-spacing:0;min-width:max-content}.calendar th,.calendar td{border-right:1px solid #e9eef5;border-bottom:1px solid #e9eef5;text-align:center;padding:0}.calendar th{height:43px;background:#f8faff;font-size:12px;min-width:36px}.calendar th.name,.calendar td.name{position:sticky;left:0;z-index:3;width:118px;min-width:118px;max-width:118px;text-align:left;background:#fff;box-shadow:2px 0 5px #0000000b}.calendar th.name{z-index:4;background:#f8faff;padding-left:9px}.calendar td.name{padding:5px}.habitname{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:108px;display:block}.datehead .dow{display:block;color:#8491a3;font-weight:400;font-size:10px}.datehead.today{background:#dceaff}.datehead.weekend{color:#d34b5b}.mark{width:32px;height:35px;margin:2px;border-radius:8px;padding:0;background:transparent;color:#c5ceda;font-size:20px;font-weight:750}.mark.yes{background:#def5e8;color:#158252}.mark.no{background:#ffebeb;color:#cf4755}.todaycell{background:#f1f6ff}.legend{display:flex;gap:15px;color:#748095;font-size:12px;margin-top:11px}.legend b{font-size:17px}.yescolor{color:#158252}.nocolor{color:#cf4755}.habits{display:flex;flex-direction:column;gap:8px;margin-top:12px}.habitrow{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:10px;background:#f8faff;padding:9px}.habitrow span{overflow-wrap:anywhere}.habitrow button{font-size:12px;padding:8px}form.add{display:flex;gap:8px;margin-top:12px}input{font:inherit;font-size:16px;min-width:0;flex:1;border:1px solid #d3dce9;border-radius:10px;padding:10px}.backups{display:flex;flex-wrap:wrap;gap:8px}.foot{color:#778498;font-size:12px}.empty{padding:20px;color:#718096}dialog{border:none;border-radius:16px;padding:18px;width:min(90%,420px);box-shadow:0 12px 60px #0e244955}dialog::backdrop{background:#12213866}dialog input{width:100%}dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0}#importFile{display:none}@media(max-width:400px){main{padding:12px 8px 35px}.panel{padding:11px}.calendar th.name,.calendar td.name{min-width:110px;max-width:110px;width:110px}}
</style></head><body><main>
<header class="top"><div><h1>○× 習慣カレンダー</h1><div class="muted">毎日の積み重ねを、ひと目で。</div></div><span class="muted">自分専用</span></header>
<section class="panel"><div class="toolbar"><div class="nav"><button id="prev" aria-label="前月">‹</button><span class="month" id="month"></span><button id="next" aria-label="翌月">›</button></div><div class="actions"><button id="today">今日へ</button><button class="primary" id="jumpAdd">＋項目追加</button></div></div><div class="summary"><div class="stat"><strong id="totalYes">0</strong><small>今月の○</small></div><div class="stat"><strong id="rate">—</strong><small>記録した日の達成率</small></div><div class="stat"><strong id="count">0</strong><small>習慣の数</small></div></div></section>
<section class="panel"><div class="toolbar"><h2>月間一覧</h2><span class="muted">日付を左右にスクロール ⇆</span></div><p class="muted">マスをタップ：空欄 → ○ → × → 空欄</p><div class="scroller" id="scroller"><table class="calendar" id="calendar" aria-label="習慣カレンダー"></table></div><div class="legend"><span><b class="yescolor">○</b> 達成</span><span><b class="nocolor">×</b> 未達成</span><span>· 未記録</span></div></section>
<section class="panel" id="manage"><h2>項目管理</h2><form id="addForm" class="add"><input id="newHabit" maxlength="40" required placeholder="例：英語学習" aria-label="習慣名"><button type="submit" class="primary">追加</button></form><div class="habits" id="habitList"></div></section>
<section class="panel"><h2>バックアップ</h2><p class="foot">○×はこの端末のブラウザ内に自動保存します。端末の故障やアプリ削除に備え、定期的にバックアップしてください。</p><div class="backups"><button id="export">↓ 書き出す</button><button id="importBtn">↑ 復元する</button><input id="importFile" type="file" accept=".json,application/json"></div></section><p class="foot">同じURLでもSafariとホーム画面アプリは記録の保存領域が異なる場合があります。普段使う方を決めてご利用ください。</p>
</main><dialog id="editDialog"><form id="editForm"><h3>項目名の変更</h3><input id="editInput" maxlength="40" required><menu><button type="button" id="cancelEdit">キャンセル</button><button class="primary" type="submit">保存</button></menu></form></dialog>
<script>
(()=>{'use strict';
const KEY='marubatsu-habits-v1', $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
let now=new Date(),year=now.getFullYear(),month=now.getMonth(),editId=null;
const makeId=()=>crypto.randomUUID?.()||'h'+Date.now()+Math.random().toString(36).slice(2);
const initial=()=>({version:1,habits:['🏃 ランニング','📚 勉強','💪 筋トレ','📖 読書'].map(name=>({id:makeId(),name})),marks:{}});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(data.habits)||!data.marks||typeof data.marks!=='object'||Array.isArray(data.marks))throw Error()}catch(e){data=initial()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('記録を保存できません。ブラウザの保存設定をご確認ください。')}}
function node(tag,t,cl){let el=document.createElement(tag);el.textContent=t;if(cl)el.className=cl;return el}
function todayMonth(){let n=new Date();return n.getFullYear()===year&&n.getMonth()===month}
function dateKey(d){return year+'-'+pad(month+1)+'-'+pad(d)}
function render(){let days=new Date(year,month+1,0).getDate(),yes=0,no=0; $('month').textContent=year+'年 '+(month+1)+'月';$('count').textContent=data.habits.length;
let table=$('calendar');table.replaceChildren();let head=document.createElement('thead'),tr=document.createElement('tr');tr.append(node('th','項目','name'));
for(let d=1;d<=days;d++){let weekday=new Date(year,month,d).getDay(),th=node('th',String(d),'datehead'+(weekday===0||weekday===6?' weekend':'')+(todayMonth()&&d===new Date().getDate()?' today':''));th.append(node('span','日月火水木金土'[weekday],'dow'));tr.append(th)}
head.append(tr);table.append(head);let body=document.createElement('tbody');
for(let h of data.habits){let row=document.createElement('tr'),name=node('td','','name');let nm=node('span',h.name,'habitname');nm.title=h.name;name.append(nm);name.onclick=()=>startEdit(h.id);row.append(name);
for(let d=1;d<=days;d++){let td=document.createElement('td');if(todayMonth()&&d===new Date().getDate())td.className='todaycell';let k=dateKey(d),v=data.marks[k]?.[h.id]||'',b=node('button',v==='yes'?'○':v==='no'?'×':'·','mark '+v);b.type='button';b.setAttribute('aria-label',h.name+' '+k+' '+(v==='yes'?'○':v==='no'?'×':'空欄'));if(v==='yes')yes++;if(v==='no')no++;
b.onclick=()=>{let next=v===''?'yes':v==='yes'?'no':'';data.marks[k]??={};if(next)data.marks[k][h.id]=next;else delete data.marks[k][h.id];if(!Object.keys(data.marks[k]).length)delete data.marks[k];save();let x=$('scroller').scrollLeft;render();$('scroller').scrollLeft=x};td.append(b);row.append(td)}body.append(row)}
if(!data.habits.length){let row=document.createElement('tr'),td=node('td','下の「項目管理」で習慣を追加してください','empty');td.colSpan=days+1;row.append(td);body.append(row)}
table.append(body);$('totalYes').textContent=yes;$('rate').textContent=yes+no?Math.round(100*yes/(yes+no))+'%':'—';renderManage()}
function renderManage(){let list=$('habitList');list.replaceChildren();for(let h of data.habits){let row=node('div','','habitrow'),name=node('span',h.name),actions=node('div','','actions'),edit=node('button','編集'),del=node('button','削除','danger');edit.onclick=()=>startEdit(h.id);del.onclick=()=>{if(confirm('「'+h.name+'」を削除しますか？過去の記録も削除されます。')){data.habits=data.habits.filter(x=>x.id!==h.id);for(let k of Object.keys(data.marks)){delete data.marks[k][h.id];if(!Object.keys(data.marks[k]).length)delete data.marks[k]}save();render()}};actions.append(edit,del);row.append(name,actions);list.append(row)}}
function startEdit(id){let h=data.habits.find(x=>x.id===id);if(!h)return;editId=id;$('editInput').value=h.name;$('editDialog').showModal()}
$('editForm').onsubmit=e=>{e.preventDefault();let value=$('editInput').value.trim(),h=data.habits.find(x=>x.id===editId);if(value&&h){h.name=value;save();render();$('editDialog').close()}};$('cancelEdit').onclick=()=>$('editDialog').close();
$('addForm').onsubmit=e=>{e.preventDefault();let inp=$('newHabit'),v=inp.value.trim();if(!v)return;data.habits.push({id:makeId(),name:v});inp.value='';save();render();inp.focus()};
$('jumpAdd').onclick=()=>{$('manage').scrollIntoView({behavior:'smooth'})};
$('prev').onclick=()=>{month--;if(month<0){month=11;year--}render();$('scroller').scrollLeft=0};$('next').onclick=()=>{month++;if(month>11){month=0;year++}render();$('scroller').scrollLeft=0};
function scrollToDay(day){let th=$('calendar').querySelectorAll('thead th')[day];if(!th)return;let fixed=$('calendar').querySelector('th.name').getBoundingClientRect().width;let target=Math.max(0,th.offsetLeft-fixed-20);$('scroller').scrollLeft=target}
$('today').onclick=()=>{let n=new Date();year=n.getFullYear();month=n.getMonth();render();scrollToDay(n.getDate())};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=node('a','');a.href=url;a.download='habits-backup-'+year+'-'+pad(month+1)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.habits)||!d.habits.every(h=>typeof h.id==='string'&&typeof h.name==='string')||!d.marks||typeof d.marks!=='object'||Array.isArray(d.marks))throw Error();if(confirm('現在の記録をバックアップで上書きしますか？')){data={version:1,habits:d.habits,marks:d.marks};save();render();alert('復元しました')}}catch(x){alert('読み込めないバックアップです')}e.target.value=''};
save();render();requestAnimationFrame(()=>scrollToDay(new Date().getDate()));
})();
if('serviceWorker' in navigator && location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
</script></body></html>
